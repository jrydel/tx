name: Release

# Push a tag like v0.2.0 to build installers for Linux, macOS and Windows and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ""
          - os: macos-14
            target: aarch64-apple-darwin
            features: "--features metal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
    runs-on: ${{ matrix.os }}
    env:
      # whisper.cpp: build for a portable CPU baseline, not the CI runner's CPU.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: CPU baseline for x86-64 (AVX2/FMA/F16C, 2013+ CPUs)
        if: startsWith(matrix.target, 'x86_64')
        shell: bash
        run: |
          {
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
          } >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libclang-dev cmake

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - name: Sidecars (yt-dlp, QuickJS, tx CLI)
        shell: bash
        run: bun scripts/sidecars.ts --target ${{ matrix.target }} ${{ matrix.features }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs installers for the in-app updater; the public half is plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: tx ${{ github.ref_name }}
          releaseBody: |
            Desktop installers for Linux, macOS (Apple Silicon) and Windows, plus the standalone `tx` CLI.
            The installers are not code-signed: macOS asks you to allow the app in System Settings → Privacy & Security, Windows SmartScreen asks you to confirm.
            tx needs [Claude Code](https://claude.com/claude-code) installed and signed in to analyze videos.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Attach the standalone CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "src-tauri/binaries/tx-${{ matrix.target }}${ext}" "tx-cli-${{ matrix.target }}${ext}"
          gh release upload "${{ github.ref_name }}" "tx-cli-${{ matrix.target }}${ext}" --clobber

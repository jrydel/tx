name: Release

# Push a tag like v0.5.1 to build the tx binary for Linux, macOS and Windows and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ""
          - os: macos-14
            target: aarch64-apple-darwin
            features: "--features metal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
    runs-on: ${{ matrix.os }}
    env:
      # whisper.cpp: build for a portable CPU baseline, not the CI runner's CPU.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: CPU baseline for x86-64 (AVX2/FMA/F16C, 2013+ CPUs)
        if: startsWith(matrix.target, 'x86_64')
        shell: bash
        run: |
          {
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
          } >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo test --workspace

      - run: cargo build --release -p tx-cli --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/tx${ext}" "tx-cli-${{ matrix.target }}${ext}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "tx $TAG" --notes "Install with the one-line installer in the README. tx runs on your computer; your Claude Code, Claude Desktop or Codex (ChatGPT) does the analysis." || true
          gh release upload "$TAG" "tx-cli-${{ matrix.target }}${ext}" --clobber

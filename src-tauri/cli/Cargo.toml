[package]
name = "tx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "tx: a video's transcript in your terminal, or ask your agent about it"

[[bin]]
name = "tx"
path = "src/main.rs"

[features]
metal = ["tx-core/metal"]
vulkan = ["tx-core/vulkan"]
cuda = ["tx-core/cuda"]

[dependencies]
tx-core = { path = "../core" }
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio.workspace = true

[workspace]
members = ["core", "cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0.104"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.0", features = ["full"] }

[package]
name = "tx-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "TL;DRs of new videos from channels you follow, scored against what you want to learn"
authors = ["Jiří Rýdel"]
repository = "https://github.com/jrydel/tx"

[lib]
name = "tx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
metal = ["tx-core/metal"]
vulkan = ["tx-core/vulkan"]
cuda = ["tx-core/cuda"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tx-core = { path = "core" }
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"

[profile.release]
lto = "thin"
strip = true

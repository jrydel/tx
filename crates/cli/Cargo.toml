[package]
name = "tx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "tx: a video's transcript in your terminal, or ask your agent about it"

[[bin]]
name = "tx"
path = "src/main.rs"

[features]
metal = ["tx-core/metal"]
vulkan = ["tx-core/vulkan"]
cuda = ["tx-core/cuda"]

[dependencies]
tx-core = { path = "../core" }
anyhow.workspace = true
log.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio.workspace = true
notify-rust = "4.18.2"
dirs = "7.0.0"
serde_json.workspace = true
chrono = "0.4.45"
toml_edit = "0.25.17"
dialoguer = "0.12.0"
tempfile = "3.27.0"
base64 = "0.23.1"
url = "2.5"

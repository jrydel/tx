<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tx</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: var(--color-text-primary, light-dark(#18181b, #f4f4f5));
    --muted: var(--color-text-secondary, light-dark(#55555f, #a1a1aa));
    --faint: var(--color-text-tertiary, light-dark(#8a8a94, #71717a));
    --panel: var(--color-background-secondary, light-dark(#f7f7f8, #1e1e22));
    --sunk: var(--color-background-tertiary, light-dark(#ececef, #29292e));
    --line: var(--color-border-secondary, light-dark(#e2e2e6, #313137));
    --watch: light-dark(#15803d, #4ade80);
    --skim: light-dark(#b45309, #fbbf24);
    --skip: light-dark(#6b7280, #8b8b96);
    --radius: var(--border-radius-lg, 12px);
    --mono: var(--font-mono, ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace);
    /* Total height of the brief: the host's available height when it says, so the host never adds its own scrollbar. */
    --app-h: 720px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.5 var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); color: var(--fg); overflow: hidden; }
  #root { padding: 2px; display: flex; flex-direction: column; }
  #root.fill { height: var(--app-h); }
  #root.cap { max-height: var(--app-h); }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .watch { --k: var(--watch); }
  .skim { --k: var(--skim); }
  .skip, .none { --k: var(--skip); }

  /* Masthead: it's a brief, so it says for when, from what, and for whom. */
  .head { margin: 0 2px 10px; display: grid; gap: 1px; }
  .head .title { display: flex; align-items: center; justify-content: space-between; gap: 4px 16px; flex-wrap: wrap; }
  .head .side { display: flex; align-items: center; gap: 12px; }
  .expand { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .expand:hover { color: var(--fg); border-color: var(--faint); }
  .head h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.005em; }
  .head h1 span { margin-left: 8px; font-weight: 500; color: var(--muted); }
  .head .scope { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .head .for { margin: 0; font-size: 12.5px; color: var(--faint); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .head .for b { font-weight: 600; color: var(--muted); margin-right: 4px; }

  /* List on the left, the selected video on the right; each scrolls on its own. */
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(250px, min(34%, 420px)) 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .list { overflow-y: auto; border-right: 1px solid var(--line); padding: 0 6px 8px; scrollbar-width: thin; }
  .group { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 7px; padding: 10px 8px 6px; background: var(--panel); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--k); }
  .group::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--k); }
  .group span { color: var(--faint); font-weight: 600; letter-spacing: 0; }
  .item { display: grid; grid-template-columns: 84px 1fr; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 8px; align-items: start; position: relative; }
  .item:hover { background: var(--sunk); }
  .item[aria-selected="true"] { background: var(--sunk); }
  .item[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--k); }
  .item .thumb { border-radius: 5px; }
  .item h3 { margin: 0; font-size: 13px; line-height: 1.32; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .item .meta { margin-top: 2px; font-size: 11.5px; }
  .meta { color: var(--faint); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--muted); font-weight: 600; }

  .thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--sunk); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Podcast artwork is square: show all of it, centered in the 16:9 frame. */
  .thumb.art img { object-fit: contain; }
  /* Behind the image, and all that's left when there is none or it fails to load: the show's initial. */
  .thumb .initial { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: var(--faint); }
  a.thumb img { transition: transform .25s; }
  a.thumb:hover img { transform: scale(1.04); }
  .thumb .len { position: absolute; right: 4px; bottom: 4px; background: #000c; color: #fff; font: 600 10.5px/1.5 var(--mono); padding: 0 4px; border-radius: 3px; }

  .detail { overflow-y: auto; padding: 18px 20px 22px; scrollbar-width: thin; }
  .solo { min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 18px 20px 22px; scrollbar-width: thin; }
  .back { display: none; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .back:hover { color: var(--fg); }
  .hero { display: grid; grid-template-columns: 188px 1fr; gap: 16px; align-items: start; }
  .hero h2 { margin: 0 0 4px; font-size: 17px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
  .call { display: inline-flex; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--k); }
  .call span { font: 600 12px var(--mono); color: var(--muted); }
  .verdict { margin: 16px 0 0; font-size: 15px; line-height: 1.5; color: var(--fg); }

  /* Signature: the video's runtime as a strip. The shaded band is the part worth watching, each tick a takeaway. */
  .timeline { margin: 16px 0 4px; }
  .strip { position: relative; height: 26px; }
  .strip .rail { position: absolute; left: 0; right: 0; top: 12px; height: 2px; border-radius: 1px; background: var(--line); }
  .strip .band { position: absolute; top: 9px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--k) 38%, transparent); }
  .strip .tick { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; display: grid; place-items: center; border-radius: 50%; }
  .strip .tick::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--panel); border: 2px solid var(--fg); transition: transform .15s, background .15s; }
  .strip .tick:hover::after, .strip .tick.lit::after { transform: scale(1.35); background: var(--fg); }
  .ends { display: flex; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--faint); }
  .reason { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .reason b { color: var(--k); font-weight: 650; margin-right: 4px; }

  .label { display: block; margin: 22px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
  .tldr { margin: 0; color: var(--muted); }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  li { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: baseline; border-radius: 6px; }
  .t { justify-self: start; font: 600 12px/1.65 var(--mono); padding: 0 6px; border-radius: 5px; background: var(--sunk); color: var(--fg); white-space: nowrap; }
  a.t:hover, li.lit .t { background: var(--fg); color: var(--panel); }
  .pending { margin: 16px 0 0; color: var(--faint); }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 132px 1fr; gap: 12px; }
    .hero h2 { font-size: 15.5px; }
  }
  /* Narrow: one pane at a time, the list first, a video after picking it. */
  @media (max-width: 600px) {
    .split { grid-template-columns: 1fr; }
    .list { border-right: 0; }
    .split:not(.showing) .detail, .split.showing .list { display: none; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  "use strict";
  const root = document.getElementById("root");
  let nextId = 1;
  const waiting = new Map();

  const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    waiting.set(id, { resolve, reject });
    send({ id, method, params });
  });

  function openLink(url) {
    request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));
  }

  let locale, timeZone, displayMode = "inline", hostModes = [];
  const expand = el("button", { type: "button", class: "expand", hidden: "" });

  /** Show the full-screen toggle only where the host offers full screen. */
  function syncExpand() {
    expand.hidden = !hostModes.includes("fullscreen");
    expand.textContent = displayMode === "fullscreen" ? "Exit full screen" : "Full screen";
  }
  expand.addEventListener("click", () => {
    request("ui/request-display-mode", { mode: displayMode === "fullscreen" ? "inline" : "fullscreen" })
      .then((r) => { if (r && r.mode) displayMode = r.mode; syncExpand(); }, () => {});
  });

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
    if (ctx.locale) locale = ctx.locale;
    if (ctx.timeZone) timeZone = ctx.timeZone;
    const max = ctx.containerDimensions && (ctx.containerDimensions.height || ctx.containerDimensions.maxHeight);
    if (max) document.documentElement.style.setProperty("--app-h", `${Math.max(360, Math.min(2400, max))}px`);
    if (ctx.displayMode) displayMode = ctx.displayMode;
    if (Array.isArray(ctx.availableDisplayModes)) hostModes = ctx.availableDisplayModes;
    syncExpand();
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
    const fonts = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
    if (fonts) { const s = document.createElement("style"); s.textContent = fonts; document.head.append(s); }
  }

  function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v; else e.setAttribute(k, v);
    }
    for (const c of children.flat()) if (c != null && c !== false) e.append(c);
    return e;
  }

  function ago(d) {
    const s = (Date.now() - d) / 1000;
    const units = [[31536000, "year"], [2592000, "month"], [604800, "week"], [86400, "day"], [3600, "hour"], [60, "minute"]];
    for (const [n, u] of units) if (s >= n) { const k = Math.floor(s / n); return `${k} ${u}${k > 1 ? "s" : ""} ago`; }
    return "just now";
  }

  /** Release time in the user's locale and time zone: "Oct 15, 2026, 7:35 PM · 6 days ago"; `short` gives "Oct 15". */
  function released(iso, short) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const opts = short ? { day: "numeric", month: "short" } : { dateStyle: "medium", timeStyle: "short" };
    let exact;
    try {
      exact = d.toLocaleString(locale, { ...opts, timeZone });
    } catch {
      exact = d.toLocaleString(undefined, opts);
    }
    return short ? exact : `${exact} · ${ago(d)}`;
  }

  /** Seconds from "mm:ss" or "h:mm:ss". */
  const secs = (t) => (t && /^\d+(:\d+){1,2}$/.test(t)) ? t.split(":").reduce((a, p) => a * 60 + Number(p), 0) : null;

  const GROUPS = { watch: "Watch", skim: "Skim", skip: "Skip", none: "Not analyzed" };
  const kindOf = (v) => v.analyzed ? (["watch", "skim", "skip"].includes(v.advice) ? v.advice : "skip") : "none";
  const stamp = (at, url) => el(url ? "a" : "span", { class: "t", "data-href": url, title: url ? `Play from ${at}` : null }, at);

  function thumb(v, link) {
    const img = v.thumbnail && el("img", { src: v.thumbnail, alt: "", loading: "lazy" });
    if (img) img.addEventListener("error", () => img.remove());
    const title = link ? (v.podcast ? "Open the episode" : "Play on YouTube") : null;
    return el(link ? "a" : "span", { class: `thumb${v.podcast ? " art" : ""}`, "data-href": link ? v.url : null, title },
      el("span", { class: "initial", "aria-hidden": "true" }, (v.channel || "?").trim().charAt(0).toUpperCase()),
      img,
      v.length && el("span", { class: "len" }, v.length));
  }

  /** A row of the list. Its group header carries the advice, so the row only needs title, channel, date and score. */
  function item(v) {
    return el("button", { type: "button", role: "option", class: `item ${kindOf(v)}`, "aria-selected": "false", title: v.title },
      thumb(v, false),
      el("div", {}, el("h3", {}, v.title),
        el("div", { class: "meta" }, `${v.channel} · ${released(v.published, true)}`, v.analyzed && [" · ", el("b", {}, `${v.relevance ?? 0}/5`)])));
  }

  /** Where the value sits in the video: the part to watch shaded, takeaways as ticks that play from that moment. */
  function timeline(v, kind) {
    const total = secs(v.length);
    if (!total) return null;
    const pct = (s) => `${Math.min(100, Math.max(0, (s / total) * 100))}%`;
    const strip = el("div", { class: "strip" }, el("div", { class: "rail" }));
    const from = kind === "watch" ? 0 : secs(v.skim_from);
    const to = kind === "watch" ? total : secs(v.skim_to);
    if (kind !== "skip" && from != null && to != null && to > from) {
      strip.append(el("div", { class: "band", style: `left:${pct(from)};width:calc(${pct(to)} - ${pct(from)})` }));
    }
    (v.takeaways || []).forEach((t, i) => {
      const s = secs(t.at);
      if (s == null) return;
      strip.append(el(t.url ? "a" : "span", { class: "tick", style: `left:${pct(s)}`, "data-href": t.url, "data-i": i, title: `${t.at} · ${t.text}` }));
    });
    return el("div", { class: "timeline", "aria-hidden": "true" }, strip, el("div", { class: "ends" }, el("span", {}, "0:00"), el("span", {}, v.length)));
  }

  /** The selected video: title beside a small thumbnail, the verdict, the timeline with the watch advice, TL;DR, then what it means for the user. */
  function detail(v) {
    const kind = kindOf(v);
    const r = v.relevance ?? 0;
    const parts = [el("div", { class: `hero ${kind}` }, thumb(v, true),
      el("div", {}, el("h2", {}, v.title),
        el("div", { class: "meta", title: v.published }, `${v.channel} · ${released(v.published)}`),
        v.analyzed && el("div", { class: "call" }, GROUPS[kind], el("span", { title: `${r} of 5 for you` }, `${r}/5 for you`))))];
    if (!v.analyzed) return [...parts, el("p", { class: "pending" }, "Not analyzed yet. Ask your agent to analyze this one.")];
    if (v.verdict) parts.push(el("p", { class: "verdict" }, v.verdict));
    const tl = timeline(v, kind);
    const range = kind === "skim" && v.skim_from ? stamp(v.skim_to ? `${v.skim_from}–${v.skim_to}` : v.skim_from, v.skim_url) : null;
    // The advice itself is already in the header; only a skim range adds to it here.
    const reason = v.reason && el("p", { class: `reason ${kind}` }, range && [el("b", {}, "Skim"), range, " "], v.reason);
    if (tl || reason) parts.push(el("div", { class: kind }, tl, reason));
    if (v.takeaways && v.takeaways.length) {
      const list = el("ul", {}, v.takeaways.map((t, i) => el("li", { "data-i": i }, t.at ? stamp(t.at, t.url) : el("span"), el("span", {}, t.text))));
      // Hovering a takeaway lights its tick on the timeline, and the other way round.
      const light = (i, on) => { for (const n of [...(tl ? tl.querySelectorAll(`[data-i="${i}"]`) : []), ...list.querySelectorAll(`[data-i="${i}"]`)]) n.classList.toggle("lit", on); };
      for (const host of [list, tl].filter(Boolean)) {
        host.addEventListener("mouseover", (e) => { const n = e.target.closest("[data-i]"); if (n) light(n.dataset.i, true); });
        host.addEventListener("mouseout", (e) => { const n = e.target.closest("[data-i]"); if (n) light(n.dataset.i, false); });
      }
      parts.push(el("span", { class: "label" }, "For you"), list);
    }
    if (v.tldr) parts.push(el("span", { class: "label" }, "What it says"), el("p", { class: "tldr" }, v.tldr));
    return parts;
  }

  /** One video: shown in full. More: a list grouped Watch, Skim, Skip (videos arrive in that order) with the selected video beside it. */
  function render(data) {
    if (!data || !Array.isArray(data.videos) || !data.videos.length) return;
    const videos = data.videos;
    const n = videos.length;
    const channels = [...new Set(videos.map((v) => v.channel))];
    const plural = (k, word) => `${k} ${word}${k > 1 ? "s" : ""}`;
    const episodes = videos.filter((v) => v.podcast).length;
    const what = [n - episodes && plural(n - episodes, "video"), episodes && plural(episodes, "episode")].filter(Boolean).join(" and ");
    const sources = !episodes ? "channels" : episodes === n ? "shows" : "channels and shows";
    const from = channels.length > 2 ? `${channels.length} ${sources}` : channels.join(" and ");
    const times = videos.map((v) => Date.parse(v.published)).filter((t) => !isNaN(t));
    const span = times.length && released(new Date(Math.min(...times)).toISOString(), true);
    const end = times.length && released(new Date(Math.max(...times)).toISOString(), true);
    const when = !times.length ? "" : span === end ? `, released ${span}` : `, released ${span} – ${end}`;
    let today;
    try { today = new Date().toLocaleDateString(locale, { weekday: "short", day: "numeric", month: "short", timeZone }); }
    catch { today = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); }
    const head = el("header", { class: "head" },
      el("div", { class: "title" }, el("h1", {}, "Your brief", el("span", {}, today)),
        el("div", { class: "side" }, el("span", { class: "scope" }, `${what} from ${from}${when}`), expand)),
      data.profile && el("p", { class: "for", title: data.profile }, el("b", {}, "Scored for"), data.profile));
    if (n === 1) {
      root.className = "cap";
      root.replaceChildren(head, el("div", { class: "solo" }, detail(videos[0])));
      return;
    }

    const items = videos.map(item);
    const list = el("div", { class: "list", role: "listbox", "aria-label": "Videos" });
    let last = null;
    videos.forEach((v, i) => {
      const k = kindOf(v);
      if (k !== last) {
        const count = videos.filter((x) => kindOf(x) === k).length;
        list.append(el("div", { class: `group ${k}`, role: "presentation" }, GROUPS[k], el("span", {}, String(count))));
        last = k;
      }
      list.append(items[i]);
    });
    const back = el("button", { type: "button", class: "back" }, "← All videos");
    const pane = el("div", { class: "detail", "aria-live": "polite" });
    const split = el("div", { class: "split" }, list, pane);
    let current = -1;
    const select = (i, show) => {
      if (i < 0 || i >= n) return;
      if (current >= 0) items[current].setAttribute("aria-selected", "false");
      current = i;
      items[i].setAttribute("aria-selected", "true");
      items[i].scrollIntoView({ block: "nearest" });
      pane.replaceChildren(back, ...detail(videos[i]));
      pane.scrollTop = 0;
      split.classList.toggle("showing", !!show);
    };
    items.forEach((b, i) => b.addEventListener("click", () => select(i, true)));
    back.addEventListener("click", () => split.classList.remove("showing"));
    list.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      e.preventDefault();
      const i = current + (e.key === "ArrowDown" ? 1 : -1);
      if (i >= 0 && i < n) { select(i, false); items[i].focus(); }
    });

    root.className = "fill";
    root.replaceChildren(head, split);
    select(0, false);
  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-href]");
    if (!a) return;
    e.preventDefault();
    openLink(a.getAttribute("data-href"));
  });

  window.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method) {
      const w = waiting.get(m.id);
      if (w) { waiting.delete(m.id); m.error ? w.reject(m.error) : w.resolve(m.result); }
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-result": render(m.params && m.params.structuredContent); break;
      case "ui/notifications/host-context-changed": applyContext(m.params); break;
      case "ui/resource-teardown": case "ping": send({ id: m.id, result: {} }); break;
      default: if (m.id != null) send({ id: m.id, error: { code: -32601, message: "not supported" } });
    }
  });

  new ResizeObserver(() => {
    const r = document.documentElement.getBoundingClientRect();
    send({ method: "ui/notifications/size-changed", params: { width: Math.ceil(r.width), height: Math.ceil(document.documentElement.scrollHeight) } });
  }).observe(document.body);

  request("ui/initialize", {
    appInfo: { name: "tx", version: "1" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
    protocolVersion: "2026-01-26",
  }).then((r) => {
    applyContext(r && r.hostContext);
    send({ method: "ui/notifications/initialized" });
  }, () => {});

  // ChatGPT Apps SDK hosts expose the tool result as window.openai.toolOutput.
  if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput);
  window.addEventListener("openai:set_globals", () => window.openai && render(window.openai.toolOutput));
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tx</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: var(--color-text-primary, light-dark(#18181b, #f4f4f5));
    --muted: var(--color-text-secondary, light-dark(#5b5b66, #a1a1aa));
    --faint: var(--color-text-tertiary, light-dark(#8a8a94, #71717a));
    --card: var(--color-background-secondary, light-dark(#f7f7f8, #1f1f23));
    --chip: var(--color-background-tertiary, light-dark(#ececef, #2c2c32));
    --line: var(--color-border-secondary, light-dark(#e4e4e7, #303036));
    --green: light-dark(#15803d, #4ade80);
    --green-bg: light-dark(#dcfce7, #14532d99);
    --amber: light-dark(#b45309, #fbbf24);
    --amber-bg: light-dark(#fef3c7, #78350f99);
    --gray: light-dark(#6b7280, #9ca3af);
    --gray-bg: light-dark(#f3f4f6, #37415199);
    --radius: var(--border-radius-lg, 12px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font: 14px/1.5 var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    color: var(--fg);
    padding: 2px;
  }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 0 2px 10px; }
  .head { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 13px; }
  .head b { color: var(--fg); font-weight: 650; letter-spacing: .02em; }
  .chips { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--chip); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .chips button { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .chips button:hover { color: var(--fg); }
  .chips button[aria-pressed="true"] { background: var(--card); color: var(--fg); }
  .chips span { margin-left: 4px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .list { display: grid; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
  .card.open { padding: 12px; }
  .top { display: grid; grid-template-columns: 176px 1fr auto; gap: 12px; align-items: start; }
  .card.open .top { grid-template-columns: 224px 1fr auto; align-items: start; gap: 14px; }
  .solo .top, .solo.open .top { grid-template-columns: 224px 1fr; }
  .card:not(.solo) .top { cursor: pointer; }
  .thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--chip); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .thumb:hover img { transform: scale(1.04); }
  .thumb .len { position: absolute; right: 5px; bottom: 5px; background: #000c; color: #fff; font-size: 11px; font-weight: 600; padding: 0 4px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .thumb .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .2s; background: #0004; }
  .thumb:hover .play { opacity: 1; }
  .play svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 6px #0008); }
  .card:not(.open) .play svg { width: 28px; height: 28px; }
  .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 8px; border-radius: 999px; }
  .watch { color: var(--green); background: var(--green-bg); }
  .skim { color: var(--amber); background: var(--amber-bg); }
  .skip, .none { color: var(--gray); background: var(--gray-bg); }
  /* The kind class (watch/skim/skip) sets the color; the bar segments use it. */
  .score { display: inline-flex; gap: 3px; align-items: center; padding: 0; background: none !important; }
  .score i { width: 12px; height: 5px; border-radius: 3px; background: var(--chip); }
  .score i.on { background: currentColor; }
  .num { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  h3 { margin: 0; font-size: 14.5px; line-height: 1.35; font-weight: 650; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
  .card.open h3 { font-size: 15.5px; -webkit-line-clamp: 2; }
  .meta { font-size: 12.5px; color: var(--faint); }
  .verdict { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .card:not(.open) .verdict { display: none; }
  /* Collapsed preview: what the video says and the one thing it means for you. Open cards show both in full. */
  .preview { display: grid; gap: 3px; margin-top: 2px; font-size: 13px; }
  .card.open .preview { display: none; }
  .summary, .key { margin: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
  .summary { color: var(--muted); -webkit-line-clamp: 2; }
  .key { -webkit-line-clamp: 2; }
  .key b { margin-right: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .key .t { margin-right: 6px; }
  .toggle { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--faint); }
  .toggle:hover { background: var(--chip); color: var(--fg); }
  .toggle svg { width: 16px; height: 16px; transition: transform .15s; }
  .card.open .toggle svg { transform: rotate(180deg); }
  .body { display: none; flex-direction: column; gap: 12px; margin-top: 12px; }
  .card.open .body { display: flex; }
  .decision { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--chip); font-size: 13.5px; color: var(--muted); }
  .decision > b { margin-right: 6px; color: var(--fg); }
  .decision > .t { margin-right: 6px; }
  .label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .tldr { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: baseline; }
  .t { justify-self: start; font: 600 12px/1.6 var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace); padding: 0 6px; border-radius: 5px; background: var(--chip); color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .decision .t { background: var(--card); }
  a.t:hover { background: var(--line); }
  .pending { color: var(--faint); font-style: italic; }
  @media (max-width: 560px) {
    .top, .card.open .top { grid-template-columns: 112px 1fr auto; }
    .solo .top, .solo.open .top { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  "use strict";
  const root = document.getElementById("root");
  let nextId = 1;
  const waiting = new Map();

  const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    waiting.set(id, { resolve, reject });
    send({ id, method, params });
  });

  function openLink(url) {
    request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));
  }

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
    if (ctx.locale) locale = ctx.locale;
    if (ctx.timeZone) timeZone = ctx.timeZone;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
    const fonts = ctx.styles && ctx.styles.css && ctx.styles.css.fonts;
    if (fonts) { const s = document.createElement("style"); s.textContent = fonts; document.head.append(s); }
  }

  function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v; else e.setAttribute(k, v);
    }
    for (const c of children.flat()) if (c != null && c !== false) e.append(c);
    return e;
  }

  let locale, timeZone;

  function ago(d) {
    const s = (Date.now() - d) / 1000;
    const units = [[31536000, "year"], [2592000, "month"], [604800, "week"], [86400, "day"], [3600, "hour"], [60, "minute"]];
    for (const [n, u] of units) if (s >= n) { const k = Math.floor(s / n); return `${k} ${u}${k > 1 ? "s" : ""} ago`; }
    return "just now";
  }

  /** "22 Oct 2026, 14:05 · 2 hours ago", in the user's locale and time zone. */
  function released(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    let exact;
    try {
      exact = d.toLocaleString(locale, { dateStyle: "medium", timeStyle: "short", timeZone });
    } catch {
      exact = d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }
    return `${exact} · ${ago(d)}`;
  }

  const PLAY = '<svg viewBox="0 0 68 48"><path d="M66.5 7.7a8.5 8.5 0 0 0-6-6C55.3.3 34 .3 34 .3s-21.3 0-26.5 1.4a8.5 8.5 0 0 0-6 6C.1 12.9.1 24 .1 24s0 11.1 1.4 16.3a8.5 8.5 0 0 0 6 6C12.7 47.7 34 47.7 34 47.7s21.3 0 26.5-1.4a8.5 8.5 0 0 0 6-6C67.9 35.1 67.9 24 67.9 24s0-11.1-1.4-16.3z" fill="#f00"/><path d="M45 24 27 14v20z" fill="#fff"/></svg>';

  const CHEVRON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>';
  const LABELS = { watch: "Watch", skim: "Skim", skip: "Skip", none: "Not analyzed" };
  const kindOf = (v) => v.analyzed ? (["watch", "skim", "skip"].includes(v.advice) ? v.advice : "skip") : "none";
  const stamp = (at, url, title) => el(url ? "a" : "span", { class: "t", "data-href": url, title: url ? title : null }, at);

  let seq = 0;
  /** One video. Collapsed it is a row (thumbnail, score, title, verdict); open it adds the advice, TL;DR and takeaways. */
  function card(v, open, solo) {
    const kind = kindOf(v);
    const r = v.relevance ?? 0;
    const bodyId = `v${++seq}`;
    const play = el("span", { class: "play" });
    play.innerHTML = PLAY;
    const thumb = el("a", { class: "thumb", "data-href": v.url, title: "Open on YouTube" },
      el("img", { src: v.thumbnail, alt: "", loading: "lazy" }),
      v.length && el("span", { class: "len" }, v.length), play);
    const score = v.analyzed && el("span", { class: `score ${kind}`, title: `${r} of 5 for you` },
      [1, 2, 3, 4, 5].map((i) => el("i", { class: i <= r ? "on" : null })));
    const key = v.takeaways && v.takeaways[0];
    const preview = v.analyzed && (v.tldr || key) && el("div", { class: "preview" },
      v.tldr && el("p", { class: "summary" }, v.tldr),
      key && el("p", { class: "key" }, el("b", {}, "For you"), key.at && stamp(key.at, key.url, `Play from ${key.at}`), key.text));
    const info = el("div", { class: "info" },
      el("div", { class: "row" }, el("span", { class: `badge ${kind}` }, LABELS[kind]), score, v.analyzed && el("span", { class: "num" }, `${r}/5`)),
      el("h3", { title: v.title }, v.title),
      el("div", { class: "meta", title: v.published }, [v.channel, released(v.published)].filter(Boolean).join(" · ")),
      v.analyzed ? v.verdict && el("p", { class: "verdict" }, v.verdict) : el("p", { class: "pending" }, "Ask your agent to analyze this one."),
      preview);
    const toggle = !solo && el("button", { type: "button", class: "toggle", "aria-controls": bodyId, "aria-label": `Details: ${v.title}` });
    if (toggle) toggle.innerHTML = CHEVRON;
    const top = el("div", { class: "top" }, thumb, info, toggle);

    const body = el("div", { class: "body", id: bodyId });
    if (v.analyzed) {
      if (v.reason) {
        const range = kind === "skim" && v.skim_from && stamp(v.skim_to ? `${v.skim_from}-${v.skim_to}` : v.skim_from, v.skim_url, `Play from ${v.skim_from}`);
        body.append(el("p", { class: "decision" }, el("b", {}, LABELS[kind]), range, v.reason));
      }
      if (v.tldr) body.append(el("div", {}, el("span", { class: "label" }, "TL;DR"), el("p", { class: "tldr" }, v.tldr)));
      if (v.takeaways && v.takeaways.length) {
        body.append(el("div", {}, el("span", { class: "label" }, "For you"),
          el("ul", {}, v.takeaways.map((t) => el("li", {}, t.at ? stamp(t.at, t.url, `Play from ${t.at}`) : el("span"), el("span", {}, t.text))))));
      }
    }

    const art = el("article", { class: `card${solo ? " solo" : ""}`, "data-kind": kind }, top, body);
    const setOpen = (o) => {
      art.classList.toggle("open", o);
      if (toggle) toggle.setAttribute("aria-expanded", String(o));
    };
    setOpen(open && v.analyzed);
    if (toggle && v.analyzed) {
      top.addEventListener("click", (e) => {
        if (!e.target.closest("[data-href]")) setOpen(!art.classList.contains("open"));
      });
    } else if (toggle) toggle.hidden = true;
    return art;
  }

  /** Up to two videos are all open. More start as rows with only the top pick open (the first to watch, else the first analyzed), plus a filter by advice. */
  function render(data) {
    if (!data || !Array.isArray(data.videos) || !data.videos.length) return;
    const videos = data.videos;
    const worthFrom = data.worth_from ?? 3;
    const n = videos.length;
    const worth = videos.filter((v) => v.analyzed && (v.relevance ?? 0) >= worthFrom).length;
    const pick = videos.find((v) => kindOf(v) === "watch") ?? videos.find((v) => v.analyzed);
    const cards = videos.map((v) => card(v, n <= 2 || v === pick, n === 1));

    const counts = {};
    for (const v of videos) counts[kindOf(v)] = (counts[kindOf(v)] || 0) + 1;
    const kinds = ["watch", "skim", "skip", "none"].filter((k) => counts[k]);
    let chips = null;
    if (n >= 4 && kinds.length > 1) {
      const buttons = ["all", ...kinds].map((k) => el("button", { type: "button", "aria-pressed": String(k === "all"), "data-kind": k },
        k === "all" ? "All" : LABELS[k], el("span", {}, String(k === "all" ? n : counts[k]))));
      chips = el("div", { class: "chips", role: "group", "aria-label": "Filter by advice" }, buttons);
      chips.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const k = b.dataset.kind;
        for (const x of buttons) x.setAttribute("aria-pressed", String(x === b));
        for (const c of cards) c.hidden = k !== "all" && c.dataset.kind !== k;
      });
    }

    root.replaceChildren(
      el("div", { class: "bar" },
        el("div", { class: "head" }, el("b", {}, "tx"), `${n} video${n > 1 ? "s" : ""}` + (worth ? ` · ${worth} worth your time` : "")),
        chips),
      el("div", { class: "list" }, cards));
  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-href]");
    if (!a) return;
    e.preventDefault();
    openLink(a.getAttribute("data-href"));
  });

  window.addEventListener("message", (e) => {
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method) {
      const w = waiting.get(m.id);
      if (w) { waiting.delete(m.id); m.error ? w.reject(m.error) : w.resolve(m.result); }
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-result": render(m.params && m.params.structuredContent); break;
      case "ui/notifications/host-context-changed": applyContext(m.params); break;
      case "ui/resource-teardown": case "ping": send({ id: m.id, result: {} }); break;
      default: if (m.id != null) send({ id: m.id, error: { code: -32601, message: "not supported" } });
    }
  });

  new ResizeObserver(() => {
    const r = document.documentElement.getBoundingClientRect();
    send({ method: "ui/notifications/size-changed", params: { width: Math.ceil(r.width), height: Math.ceil(document.documentElement.scrollHeight) } });
  }).observe(document.body);

  request("ui/initialize", {
    appInfo: { name: "tx", version: "1" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: "2026-01-26",
  }).then((r) => {
    applyContext(r && r.hostContext);
    send({ method: "ui/notifications/initialized" });
  }, () => {});

  // ChatGPT Apps SDK hosts expose the tool result as window.openai.toolOutput.
  if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput);
  window.addEventListener("openai:set_globals", () => window.openai && render(window.openai.toolOutput));
</script>
</body>
</html>

[project]
name = "tx"
version = "0.1.0"
description = "Video URL -> skimmable transcript in your terminal, then ask an agent about it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2025.10.22",
    "faster-whisper>=1.1",
]

[project.scripts]
tx = "tx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

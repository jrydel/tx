[project]
name = "tx"
version = "0.1.0"
description = "TL;DRs of new videos from channels you follow, scored against what you want to learn; transcripts in your terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2025.10.22",
    "faster-whisper>=1.1",
    "secretstorage>=3.3; sys_platform == 'linux'",  # yt-dlp: decrypt Chromium cookies
    "imageio-ffmpeg>=0.5",  # ffmpeg binary when none is on PATH (Windows/macOS)
]

[project.scripts]
tx = "tx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[workspace]
members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/jrydel/tx"

[workspace.dependencies]
anyhow = "1.0.104"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.0", features = ["full"] }

[profile.release]
lto = "thin"
strip = true
